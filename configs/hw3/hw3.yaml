# ДЗ №3: анализ ошибок, срезы и устойчивость выбранного решения ДЗ №2.
# Модель берется целиком из E2_calendar (признаки, лаги, LightGBM, 300 деревьев, фолды).
# Здесь только настройки анализа; гиперпараметры модели не меняются.
base: ../hw2/E2_calendar__seed42.yaml
experiment_id: E2_calendar
hypothesis: "ДЗ №3: анализ ошибок, срезы и проверки устойчивости E2_calendar"
output_dir: outputs/hw3

# те же 3 seed, что в ДЗ №2; основной анализ ошибок и срезов - на seed 42
seeds: [42, 7, 2024]
main_seed: 42

# проверка 1: доля train по времени. Берем последние f * (cutoff - train_start) дней
# перед началом фолда, validation и фолды не меняются
train_fractions: [1.0, 0.75, 0.5, 0.35, 0.2]

# проверка 2: гауссов шум в лагах и скользящих средних на validation (модель не переобучается).
# Независимый шум в 7 готовых признаках log1p (история продаж не меняется): проверка чувствительности, а не модель ошибок учета продаж
noise_sigmas: [0.0, 0.05, 0.1, 0.2, 0.3, 0.5]
noise_seed: 0

# эксперименты ДЗ №2 с выбранным решением (MLflow, база mlflow.db, эксперимент store-sales-hw2)
hw2_runs:
  42: 3610677582f7420590fa41d49a44f0c8
  7: 89156dd17d0a40d0946bf333b8e80be9
  2024: 074dac2481474cbebc846846b71be386

# отдельная база MLflow для ДЗ №3, чтобы не трогать mlflow.db из ДЗ №1-2
mlflow:
  tracking_uri: sqlite:///outputs/hw3/mlflow.db
  experiment: store-sales-hw3
  artifact_dir: outputs/hw3/mlartifacts
